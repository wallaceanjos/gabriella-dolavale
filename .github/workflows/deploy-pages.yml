name: Deploy to GitHub Pages

# Publishes out/ to GitHub Pages on every push to main.
# One-time setup in the repo: Settings > Pages > Source = "GitHub Actions".
#
# Until the custom domain exists the site is served at https://<owner>.github.io/<repo>/,
# under a base path and with noindex. Once the domain points to GitHub Pages, set the
# repository variable CUSTOM_DOMAIN (e.g. www.dragabrielladolavale.com): the next deploy
# drops the base path and the noindex.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure site URL
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "NEXT_PUBLIC_SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            owner="${GITHUB_REPOSITORY_OWNER,,}"
            echo "NEXT_PUBLIC_SITE_URL=https://$owner.github.io/$REPO_NAME" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_NOINDEX=1" >> "$GITHUB_ENV"
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
